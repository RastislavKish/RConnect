[package]
name = "rconnect"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
evdev = "0.13.2"
iroh = "1.2.0"
iroh-mdns-address-lookup = "0.5.0"
pipewire = "0.10.1"
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
rconnect-opus = { version = "0.1.0", path = "../../opus" }
rconnect-protocol = { version = "0.1.0", path = "../../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminal_size = "0.4.4"
tokio = { version = "1.53.1", features = ["rt", "macros", "io-util", "io-std", "process", "net", "sync", "time", "fs", "signal", "rt-multi-thread"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
