[package]
name = "rconnect"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rconnect-protocol = { version = "0.1.0", path = "../../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "io-util", "io-std", "process", "net", "sync", "time", "fs"] }
