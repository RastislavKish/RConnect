[package]
name = "rconnect-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = "3.0.0"
blake3 = "1.8.7"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "io-util"] }
