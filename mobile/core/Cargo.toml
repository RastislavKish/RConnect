[package]
name = "rconnect-core"
version = "0.1.0"
edition = "2024"
description = "Controller side of RConnect: the Rust core of the Android app"

[dependencies]
anyhow = "1.0.104"
earshot = "1.2.2"
iroh = "1.2.0"
iroh-mdns-address-lookup = "0.5.0"
rconnect-audio = { version = "0.1.0", path = "../../audio" }
rconnect-opus = { version = "0.1.0", path = "../../opus" }
rconnect-protocol = { version = "0.1.0", path = "../../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
cmake = "0.1.58"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.18.2"
